<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Atlas Air 3D</title>
<meta name="description" content="قُد طائرة ركاب وابنِ شركة طيران من الدار البيضاء — Atlas Air 3D">
<meta name="theme-color" content="#0f3f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas Air">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #faf3e1; --dim: #cfc6b4; --teal: #0f3f45; --teal2: #1e5c61; --copper: #e08c4c;
  --good: #73e6b3; --bad: #ff7559; --bg: rgba(8, 36, 40, 0.9); --card: rgba(250, 243, 225, 0.07); --line: rgba(250,243,225,.12);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: rgba(8, 36, 40, 0.92); } }
:root[data-theme="dark"] { --bg: rgba(8, 36, 40, 0.92); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #c98b5e; color: var(--ink);
  font-family: "Noto Kufi Arabic", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#view { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; touch-action: none; }
:root { --top-h: 58px; }
.hidden { display: none !important; }
button { font: inherit; color: var(--ink); background: var(--teal2); border: 0; border-radius: 10px; padding: 8px 12px; min-height: 42px; font-size: 14px; cursor: pointer; }
button.primary { background: var(--copper); }
button.on { background: var(--copper); }
button:disabled { background: rgba(80, 85, 85, .7); color: #bbb; cursor: default; }
button:hover:not(:disabled) { filter: brightness(1.1); }
select, input[type=range] { font: inherit; }
select { background: var(--teal2); color: var(--ink); border: 0; border-radius: 8px; padding: 6px 8px; min-height: 36px; }
input[type=range] { width: 100%; accent-color: var(--copper); }
.dim { color: var(--dim); font-size: 13px; } .good { color: var(--good); } .bad { color: var(--bad); } .cop { color: var(--copper); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
/* top bar */
#top { position: fixed; top: 0; left: 0; right: 0; padding: calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) 8px calc(10px + var(--safe-l));
  display: flex; gap: 8px; align-items: center; background: linear-gradient(rgba(6,26,30,.8), rgba(6,26,30,0)); pointer-events: none; }
#top > * { pointer-events: auto; }
#top .title { color: var(--copper); font-weight: 700; font-size: 18px; white-space: nowrap; }
.chip { background: rgba(10,36,40,.75); border-radius: 10px; padding: 6px 10px; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#speed button { min-height: 34px; padding: 4px 10px; }
/* side panel */
#side { position: fixed; top: calc(var(--top-h) + 4px); bottom: calc(10px + var(--safe-b)); inset-inline-end: calc(10px + var(--safe-r));
  width: min(380px, 44vw); background: var(--bg); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
#tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; min-height: 36px; padding: 4px 6px; position: relative; }
#tabs .badge { position: absolute; top: -4px; inset-inline-end: -4px; background: var(--bad); color: #fff; border-radius: 9px; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; }
#tabBody { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
.card { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.card.attn { outline: 2px solid var(--copper); }
.card .t { font-weight: 600; font-size: 15px; }
.bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--copper); }
#sideToggle { position: fixed; top: calc(var(--top-h) + 4px); inset-inline-end: calc(10px + var(--safe-r)); display: none; }
/* selected aircraft */
#sel { position: fixed; bottom: calc(12px + var(--safe-b)); inset-inline-start: calc(12px + var(--safe-l)); width: min(420px, 52vw); background: var(--bg); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
#sel .act { font-size: 17px; min-height: 52px; }
/* labels over aircraft */
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); background: rgba(10,36,40,.82); border-radius: 8px; padding: 2px 7px; font-size: 12px; white-space: nowrap; pointer-events: auto; cursor: pointer; border: 1px solid rgba(250,243,225,.25); direction: ltr; }
.tag.attn { background: var(--copper); animation: pulse 1s infinite alternate; }
.tag.sel { border-color: #ffc233; border-width: 2px; }
@keyframes pulse { from { transform: translate(-50%, -100%) scale(1); } to { transform: translate(-50%, -100%) scale(1.12); } }
/* toasts */
#toasts { position: fixed; z-index: 5; top: calc(var(--top-h) + 6px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(520px, 60vw); }
.toast { background: rgba(10,36,40,.88); border-radius: 10px; padding: 6px 12px; font-size: 14px; text-align: center; transition: opacity .5s; }
.toast.money { color: var(--good); }
#tip { position: fixed; bottom: calc(12px + var(--safe-b)); left: 50%; transform: translateX(-50%); width: min(560px, 70vw); background: var(--bg); border-radius: 14px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0f3f45; font-size: 22px; z-index: 10; }
@media (max-width: 760px), (max-height: 480px) {
  #top .title { display: none; } .chip { font-size: 12px; padding: 4px 8px; } #top { gap: 5px; }
  #side { width: min(330px, 48vw); }
  #side.collapsed { display: none; } #sideToggle { display: block; }
  #sel { width: min(330px, 46vw); padding: 8px 10px; } #sel .act { min-height: 44px; font-size: 15px; }
  button { font-size: 13px; min-height: 38px; } #tip { width: min(420px, 50vw); font-size: 12px; inset-inline-start: calc(12px + var(--safe-l)); left: auto; transform: none; }
}
/* Portrait phones: two-row top bar, bottom sheet panel, cards above it. */
@media (orientation: portrait) {
  #top { flex-wrap: wrap; row-gap: 6px; background: linear-gradient(rgba(6,26,30,.85), rgba(6,26,30,.35)); padding-bottom: 6px; }
  #top .title { display: none; }
  #top .chip { font-size: 13px; padding: 5px 8px; }
  #top .spacer { display: none; }
  #speed { order: 5; } #overview { order: 6; margin-inline-start: auto; } #lang { order: 7; }
  #speed button, #overview, #lang { min-height: 34px; padding: 4px 10px; font-size: 13px; }
  #sideToggle { display: none !important; }
  #side, #side.collapsed { display: flex; top: auto; inset-inline: calc(8px + var(--safe-l)) calc(8px + var(--safe-r)); width: auto;
    bottom: calc(8px + var(--safe-b)); height: 42vh; height: 42svh; border-radius: 16px; }
  #side.collapsed { height: auto; } #side.collapsed #tabBody { display: none; }
  #tabs button { font-size: 13px; }
  #sel { inset-inline: calc(8px + var(--safe-l)) calc(8px + var(--safe-r)); width: auto; bottom: calc(42svh + 16px + var(--safe-b)); padding: 8px 12px; }
  body.sheet-collapsed #sel { bottom: calc(70px + var(--safe-b)); }
  #toasts { width: calc(100vw - 24px); }
  .toast { font-size: 13px; }
  #tip { left: 8px; right: 8px; width: auto; transform: none; bottom: calc(42svh + 16px + var(--safe-b)); font-size: 13px; }
}
/* Art assets */
.ic { width: 20px; height: 20px; vertical-align: middle; margin-inline-end: 6px; flex: none; pointer-events: none; }
button .ic { margin-inline-end: 6px; }
#tabs button { display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
#tabs .ic { width: 18px; height: 18px; margin: 0; }
.chip { display: inline-flex; align-items: center; } .chip .ic { width: 17px; height: 17px; }
.hero { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; display: block; }
.hero.ac { aspect-ratio: 2 / 1; object-fit: contain; background: radial-gradient(ellipse at 50% 65%, rgba(250,243,225,.12), rgba(250,243,225,0) 70%); }
.thumb { width: 64px; height: 42px; object-fit: contain; flex: none; }
#side { background: linear-gradient(rgba(8,36,40,.9), rgba(8,36,40,.94)), url(assets/ui/loading_bg.webp) center / cover; }
#loading { background: #0f3f45 url(assets/ui/splash_keyart.webp) center / cover; flex-direction: column; gap: 14px; display: flex; align-items: center; justify-content: center; }
#loading img { width: min(260px, 50vw); filter: drop-shadow(0 4px 18px rgba(0,0,0,.45)); }
#loading span { background: rgba(8,36,40,.75); padding: 6px 16px; border-radius: 12px; font-size: 16px; }
@media (orientation: portrait) { #tabs .ic { display: none; } }
@media (max-width: 760px), (max-height: 480px) { .hero { aspect-ratio: 16 / 7; } .hero.ac { aspect-ratio: 3 / 1; } }
</style>
<link rel="stylesheet" href="visual.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="top">
  <div class="title"></div>
  <div class="chip" id="money"></div>
  <div class="chip" id="rep"></div>
  <div class="chip" id="clock"></div>
  <div class="row" id="speed"></div>
  <div class="spacer"></div>
  <button id="overview"></button>
  <button id="lang"></button>
</div>
<button id="sideToggle" type="button" aria-controls="tabBody" aria-expanded="true">☰</button>
<div id="side">
  <nav id="tabs"></nav>
  <div id="tabBody"></div>
</div>
<div id="sel" class="hidden"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" class="hidden"><span id="tipText"></span><button id="tipClose">OK</button></div>
<div id="loading"><img src="assets/ui/airline_logo.webp" alt="Atlas Air" onerror="this.remove()"><span>…</span></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
